# Local development database. The API and web app run on the host (see README).
name: slotted

services:
  postgres:
    # Same major version as Neon and the Testcontainers tests.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slotted}
      POSTGRES_USER: ${POSTGRES_USER:-slotted}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slotted}
      TZ: UTC
    ports:
      # Bound to localhost only, so the database is not exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
