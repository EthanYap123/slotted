version: 2
updates:
  - package-ecosystem: maven
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(api)

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(web)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
