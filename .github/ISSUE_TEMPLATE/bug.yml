name: Bug report
description: Something does not work as the PRD says it should
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as the demo student
        2. Book Study Room 3 for 14:00-15:00 SGT tomorrow
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Booking, Waitlist, Check-in, Rooms and facilities, Auth, Admin and analytics, Email, Deployment, Other]
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Local, Staging, Production]
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request ID
      description: From the error message or the `X-Request-Id` response header, if you have it.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets, tokens or personal data first.
