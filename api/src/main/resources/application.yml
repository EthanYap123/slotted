spring:
  application:
    name: slotted-api
  config:
    # Local development settings from api/.env (git-ignored); see api/.env.example.
    import: optional:file:.env[.properties]
  main:
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slotted}
    username: ${DB_USERNAME:slotted}
    password: ${DB_PASSWORD:slotted}
    hikari:
      # Keep no idle connections so Neon can scale to zero when the API is quiet (docs/COSTS.md).
      minimum-idle: 0
      maximum-pool-size: 5
      # Hikari timeouts are in milliseconds.
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

slotted:
  auth:
    # HS256 signing key, at least 32 characters. Set JWT_SECRET; there is no default (ADR-0002).
    jwt-secret: ${JWT_SECRET:}
    issuer: slotted
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  bootstrap-admin:
    # First admin, created on startup only if no admin exists. Leave ADMIN_EMAIL empty to skip.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_NAME:Administrator}
  cors:
    # Comma-separated web origins allowed to call the API.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
